---
# GitLab CI/CD Pipeline for grpc-zig
# SPDX-License-Identifier: Apache-2.0
#
# Reusable components live in gitlab.com/devnw/ci-catalog and are pinned to
# the same versions other Zig projects in this group use (thread-pool, otel).
# Linux jobs run on the self-hosted `company` runner group; macOS/Windows
# jobs are gated and only run on default branch, schedule, or with
# RUN_CROSS_OS=true so pipelines without those runners still pass.

# Cancel in-flight pipelines on new commits except for release-producing
# runs (tag pipelines and default-branch pipelines, which feed
# release-semantic). Jobs default to interruptible so the auto-cancel
# actually kicks in.
workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: '$CI_COMMIT_TAG'
      auto_cancel:
        on_new_commit: none
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      auto_cancel:
        on_new_commit: none
    - when: always

default:
  interruptible: true
  # Default to a Linux runner. The catalog `zig-build` / `zig-test` /
  # `zig-format` components don't expose a `tags` input, and the company
  # runner pool advertises both Linux (`Lab Servers`) and Windows
  # (`Hosted Windows Runners`) under the bare `company` tag — so a
  # bash/ubuntu-image job will land on the Windows runner about half the
  # time and PowerShell will fail trying to interpret bash as cmdlets.
  # Pinning `linux` here scopes every default job to a Linux runner;
  # Windows-specific jobs override with `tags: ["company", "windows"]`.
  tags:
    - company
    - linux

include:
  # Security scanning.
  - component: gitlab.com/devnw/ci-catalog/security-sast@v1.54.0
  - component: gitlab.com/devnw/ci-catalog/security-dependency-scanning@v1.54.0
  - component: gitlab.com/devnw/ci-catalog/security-secrets@v1.54.0
  - component: gitlab.com/devnw/ci-catalog/security-gitleaks@v1.54.0

  # SBOM.
  - component: gitlab.com/devnw/ci-catalog/sbom-generate@v1.54.0
  - component: gitlab.com/devnw/ci-catalog/sbom-scan@v1.54.0

  # Semantic release on main / tags.
  - component: gitlab.com/devnw/ci-catalog/release-semantic@v1.54.0

  # Zig formatting (Linux). Paths cover everything we author in this repo.
  - component: gitlab.com/devnw/ci-catalog/zig-format@v1.54.0
    inputs:
      zig_version: "0.16.0"
      paths: "src/ examples/ integration_test/ interop/zig/"

  # Zig build (Linux): compile lib + tests via the build.zig `check` step.
  - component: gitlab.com/devnw/ci-catalog/zig-build@v1.54.0
    inputs:
      stage: build
      zig_version: "0.16.0"
      build_options: "check"

  # Zig unit tests across all four optimize modes (Linux). Pass `tags`
  # explicitly because the catalog template sets `tags: $[[ inputs.tags ]]`
  # which (with an empty default) blasts through the workflow-level
  # default — so without this, jobs match any untagged runner including
  # the broken Lab Devices ARM GPU box (`linux` is in its tag_list, but
  # `company` is not).
  - component: gitlab.com/devnw/ci-catalog/zig-test@v1.54.0
    inputs:
      zig_version: "0.16.0"
      job_suffix: "-unit-debug"
      test_step: "test"
      optimize: "Debug"
      tags: ["company", "linux"]
  - component: gitlab.com/devnw/ci-catalog/zig-test@v1.54.0
    inputs:
      zig_version: "0.16.0"
      job_suffix: "-unit-releasesafe"
      test_step: "test"
      optimize: "ReleaseSafe"
      tags: ["company", "linux"]
  - component: gitlab.com/devnw/ci-catalog/zig-test@v1.54.0
    inputs:
      zig_version: "0.16.0"
      job_suffix: "-unit-releasefast"
      test_step: "test"
      optimize: "ReleaseFast"
      tags: ["company", "linux"]
  - component: gitlab.com/devnw/ci-catalog/zig-test@v1.54.0
    inputs:
      zig_version: "0.16.0"
      job_suffix: "-unit-releasesmall"
      test_step: "test"
      optimize: "ReleaseSmall"
      tags: ["company", "linux"]

  # Cross-OS build smoke (gated). The Linux test matrix above is the source
  # of truth; macOS/Windows just confirm we still compile everywhere. The
  # macOS/Windows catalog components run `zig build "$build_step" $build_options`,
  # so use `build_step: "check"` and leave `build_options` empty — our
  # build.zig defines `check` but not a top-level `build` step.
  - component: gitlab.com/devnw/ci-catalog/zig-build-macos@v1.54.0
    inputs:
      zig_version: "0.16.0"
      build_step: "check"
      build_options: ""
  - component: gitlab.com/devnw/ci-catalog/zig-test-macos@v1.54.0
    inputs:
      zig_version: "0.16.0"
      job_suffix: "-unit"
      test_step: "test"
  - component: gitlab.com/devnw/ci-catalog/zig-build-windows@v1.54.0
    inputs:
      zig_version: "0.16.0"
      build_step: "check"
      build_options: ""
      tags: ["company", "windows"]
  - component: gitlab.com/devnw/ci-catalog/zig-test-windows@v1.54.0
    inputs:
      zig_version: "0.16.0"
      job_suffix: "-unit"
      test_step: "test"
      tags: ["company", "windows"]
  - component: gitlab.com/devnw/ci-catalog/zig-version-tag-check@v1.54.0

variables:
  ZIG_VERSION: "0.16.0"

stages:
  - lint
  - build
  - test
  - interop
  - security
  - sbom
  - release

# ---------------------------------------------------------------
# Cross-OS gating: catalog jobs above run unconditionally; we
# tighten them to only run on default branch, schedule, or with
# RUN_CROSS_OS=true so MR pipelines without those runners pass.
# ---------------------------------------------------------------

.cross-os-rules: &cross-os-rules
  - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  - if: '$CI_PIPELINE_SOURCE == "schedule"'
  - if: '$RUN_CROSS_OS == "true"'
  - when: manual
    allow_failure: true

# Cross-OS jobs are best-effort: GitLab's SaaS macOS fleet has been known
# to hang for >25 min provisioning a VM (stuck on
# "Creating nesting VM macos-15-xcode-16"). Three guards:
#   * `allow_failure: true` — a stuck cross-OS job never fails the pipeline.
#   * `timeout: 10m` — auto-cancel anything that sits in provisioning
#     longer than a real run could plausibly need.
#   * Explicit `needs:` overrides on the Linux test jobs (below) — Linux
#     fans out as soon as the Linux build is green, regardless of cross-OS
#     state.
zig-build-macos-0.16.0:
  rules: *cross-os-rules
  allow_failure: true
  timeout: 10m

zig-test-macos-unit-0.16.0:
  rules: *cross-os-rules
  needs: ["zig-build-macos-0.16.0"]
  allow_failure: true
  timeout: 10m

zig-build-windows-0.16.0:
  rules: *cross-os-rules
  allow_failure: true
  timeout: 10m

zig-test-windows-unit-0.16.0:
  rules: *cross-os-rules
  needs: ["zig-build-windows-0.16.0"]
  allow_failure: true
  timeout: 10m

# Linux unit tests should fan out as soon as the Linux build is green;
# they must not wait on cross-OS builds. Catalog v1.22.0 doesn't expose a
# `needs` input, so we override here.
zig-test-unit-debug-0.16.0:
  needs: ["zig-build-0.16.0"]

zig-test-unit-releasesafe-0.16.0:
  needs: ["zig-build-0.16.0"]

zig-test-unit-releasefast-0.16.0:
  needs: ["zig-build-0.16.0"]

zig-test-unit-releasesmall-0.16.0:
  needs: ["zig-build-0.16.0"]

# ---------------------------------------------------------------
# grpc-zig-specific jobs.
#
# We install Zig directly via scripts/install-zig.sh on a stock
# ubuntu:24.04 image. The catalog publishes :0.15.2 but not :0.16.0
# yet (as of v1.22.0); the catalog-driven zig-build / zig-test jobs
# bootstrap zig themselves, so we mirror that pattern here.
# ---------------------------------------------------------------

.zig-host-base:
  image: "ubuntu:24.04"
  interruptible: true
  before_script:
    - apt-get update -qq
    - apt-get install -y --no-install-recommends curl ca-certificates xz-utils git build-essential python3
    - bash scripts/install-zig.sh "$ZIG_VERSION"
    - export PATH="$(pwd)/zig-${ZIG_VERSION}:$PATH"
    - zig version

# In-process loopback test: builds a binary that runs server + client in one
# process and exercises six end-to-end scenarios (sequential, large payload,
# compression, server streaming, parallel connections, multiplexed
# in-flight). Ran under a 60 s wall clock — if the binary deadlocks the job
# fails with exit 124.
loopback-test:
  extends: .zig-host-base
  stage: test
  script:
    - zig build loopback-test
    - timeout 60 ./zig-out/bin/grpc-loopback-test
  needs: ["zig-build-0.16.0"]

# Connection-thread stack-overflow reproduction (GAP-0018 — remote DoS).
# Runs a server on a stack-trace-capturing allocator (DebugAllocator, as the
# shipped example uses) and opens a single raw TCP connection. Before the fix
# the 512 KiB connection-thread stack overflowed in the DWARF self-unwinder
# during `Transport.initServer` -> `allocStreamWindows`, SIGSEGV-ing the
# process on the FIRST accepted connection. The binary must exit 0 and print
# "CONN STACK TEST PASSED"; a crash surfaces as a non-zero exit (124 if it
# hangs after the SIGSEGV). Run under a 30 s wall clock.
conn-stack-test:
  extends: .zig-host-base
  stage: test
  script:
    - zig build conn-stack-test
    - timeout 30 ./zig-out/bin/grpc-conn-stack-test
  needs: ["zig-build-0.16.0"]

# Go-Go interop is the control: proves the harness itself works.
# Must pass — this never fails because of grpc-zig protocol gaps.
interop-go-go:
  stage: interop
  image: "golang:1.22"
  tags: ["company", "linux"]
  needs: []
  before_script:
    - apt-get update -qq && apt-get install -y --no-install-recommends curl ca-certificates
    - mkdir -p zig-out/bin
  script:
    - cd interop/go
    - go build -o ../../zig-out/bin/grpc-interop-go-server ./server
    - go build -o ../../zig-out/bin/grpc-interop-go-client ./client
    - cd ../..
    - chmod +x interop/scripts/run-pair.sh
    - interop/scripts/run-pair.sh ./zig-out/bin/grpc-interop-go-server ./zig-out/bin/grpc-interop-go-client 50061 --message ci-hello --tag go-go

# Cross-pair full matrix (Go × Zig in both directions). Now a required
# gate: the request-HEADERS fix landed (see commit a9adadd) and all four
# pairs are expected to pass. If this regresses, treat it as a real
# protocol break — don't paper over it with `allow_failure`.
interop-cross:
  stage: interop
  image: "golang:1.22"
  tags: ["company", "linux"]
  needs: ["zig-build-0.16.0"]
  before_script:
    - apt-get update -qq && apt-get install -y --no-install-recommends curl ca-certificates xz-utils python3 build-essential
    - bash scripts/install-zig.sh "$ZIG_VERSION"
    - export PATH="$(pwd)/zig-${ZIG_VERSION}:$PATH"
    - zig version
    - mkdir -p zig-out/bin
    - zig build interop-server interop-client
    - cd interop/go && go build -o ../../zig-out/bin/grpc-interop-go-server ./server && go build -o ../../zig-out/bin/grpc-interop-go-client ./client && cd ../..
  script:
    - chmod +x interop/scripts/run-pair.sh interop/scripts/run-matrix.sh
    - interop/scripts/run-matrix.sh

# h2spec conformance test (closes part of GAP-0004 / NW-1+NW-2+NW-3 +
# GitLab #5). h2spec is a Go binary — we install the upstream
# v2.6.0 release tarball, start a Zig interop server in the background,
# and run the generic + http2 test suites against it. A real protocol
# regression here breaks the build on the default branch; for
# cross-OS / preview pipelines the cross-os-rules guard keeps it
# tolerant. If the SaaS runner image lacks curl/tar at this stage the
# job will fail in `before_script`; that's logged as a blocker rather
# than allowed to silently pass.
interop-h2spec:
  stage: interop
  image: "ubuntu:24.04"
  tags: ["company", "linux"]
  needs: ["zig-build-0.16.0"]
  before_script:
    - apt-get update -qq
    - apt-get install -y --no-install-recommends curl ca-certificates xz-utils python3 build-essential tar
    - bash scripts/install-zig.sh "$ZIG_VERSION"
    - export PATH="$(pwd)/zig-${ZIG_VERSION}:$PATH"
    - zig version
    - mkdir -p zig-out/bin
    - zig build interop-server
    # Fetch h2spec v2.6.0 (latest release as of Apr 2026).
    - curl -fsSL https://github.com/summerwind/h2spec/releases/download/v2.6.0/h2spec_linux_amd64.tar.gz -o h2spec.tar.gz
    - tar xzf h2spec.tar.gz
    - chmod +x ./h2spec
    - ./h2spec --version
  script:
    - ./zig-out/bin/grpc-interop-zig-server --port 50062 &
    - ZIG_SERVER_PID=$!
    - sleep 1
    # Run h2spec generic + http2 sections against the Zig server. Any
    # non-zero exit code fails the job. The skip list below records
    # known-acceptable shortcomings; today the list is empty.
    - ./h2spec --host 127.0.0.1 --port 50062 generic http2 -v
    - SPEC_RC=$?
    - kill $ZIG_SERVER_PID || true
    - exit $SPEC_RC

# ---------------------------------------------------------------------------
# FIPS-140-3 dual-mode test (-Dfips=true).
#
# `fips-deps` builds the latest OpenSSL 3.x + FIPS provider into
# /usr/local/ssl (via the repo `make deps` target, which the ci-catalog
# `zig-fips-build` component also provides). `test-fips` then runs the suite
# against the validated FIPS backend. Linux-only; MR + default-branch.
fips-deps:
  extends: .zig-host-base
  stage: build
  script:
    - make deps   # builds latest OpenSSL + FIPS provider into /usr/local/ssl
  artifacts:
    paths:
      - /usr/local/ssl
    expire_in: 1 day
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

test-fips:
  extends: .zig-host-base
  stage: test
  script:
    - OPENSSL_CONF=/usr/local/ssl/ssl/openssl.cnf zig build test -Dfips=true -Dopenssl_path=/usr/local/ssl --summary all
  needs:
    - fips-deps
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
